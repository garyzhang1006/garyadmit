name: Build corpus

# Scraping runs here, not on the laptop. Trigger it from the Actions tab or
# `gh workflow run build-corpus.yml`, then `git pull` to get corpus/.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources to rebuild; the rest are kept from the last build. Empty rebuilds all."
        default: ""
      limit:
        description: "Max pages per source (smoke test). Empty means no limit."
        default: ""
      commit:
        description: "Commit the result"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY" --keep-others); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          python scripts/build_corpus.py "${args[@]}"
        env:
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
      - name: Sample new records
        if: ${{ inputs.only != '' }}
        run: |
          for s in ${ONLY//,/ }; do
            grep "\"source\": \"$s\"" corpus/essays.jsonl | head -3 | cut -c1-1500 || true
            echo "$s: $(grep -c "\"source\": \"$s\"" corpus/essays.jsonl || true) records"
          done
        env:
          ONLY: ${{ inputs.only }}
      - name: Commit corpus
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/
          if git diff --cached --quiet; then
            echo "Corpus unchanged."
          else
            git commit -m "Rebuild essay corpus"
            git push
          fi
      - name: Upload corpus for inspection
        if: ${{ !inputs.commit }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus/
